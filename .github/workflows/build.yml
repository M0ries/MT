name: Build MRecorder

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Include Windows runtime
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            Copy-Item (Join-Path $env:WINDIR "System32/$dll") $release -ErrorAction Stop
          }
      - run: choco install innosetup --no-progress -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\MT.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: MR-Windows-Installer
          path: build/installer/MR_windows_1.3.2.exe

  apple:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: mkdir -p build/dmg && cp -R build/macos/Build/Products/Release/MRecorder.app build/dmg/ && ln -s /Applications build/dmg/Applications
      - run: hdiutil create -volname MRecorder -srcfolder build/dmg -ov -format UDZO MR_macos_1.3.2.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MR-macOS-DMG
          path: MR_macos_1.3.2.dmg
      - run: flutter build ios --release --no-codesign
      - run: mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/ && zip -qr MR_ios_unsigned_1.3.2.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MR-iOS-Unsigned-IPA
          path: MR_ios_unsigned_1.3.2.ipa

  release:
    if: github.event_name == 'release'
    needs: [quality, windows, apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MR-Windows-Installer
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: MR-macOS-DMG
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: MR-iOS-Unsigned-IPA
          path: dist
      - name: Add installers to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/MR_windows_1.3.2.exe dist/MR_macos_1.3.2.dmg dist/MR_ios_unsigned_1.3.2.ipa --clobber
